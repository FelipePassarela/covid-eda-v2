name: Ruff
on: [pull_request]

permissions:
  contents: read

jobs:
  ruff:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: --version
      - run: ruff check .
      - run: ruff format --check .
