# liblinear supports only the l1_ratio endpoints (L2=0, L1=1).
classifier__C:
  _target_: optuna.distributions.FloatDistribution
  low: 0.0001
  high: 10.0
  log: true
classifier__l1_ratio:
  _target_: optuna.distributions.CategoricalDistribution
  choices:
  - 0.0
  - 1.0
classifier__solver:
  _target_: optuna.distributions.CategoricalDistribution
  choices:
  - liblinear
