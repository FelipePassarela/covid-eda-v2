defaults:
  - /pipeline: logistic-regression
  - override /pipeline/preprocessor: linear-mrmr
  - _self_

name: tune-${hydra:runtime.choices.pipeline}
data_path: data/interim/train.csv

n_splits: 5
n_fold_repeats: 1
n_searches: 30

scoring:
  - balanced_accuracy
  - f1
  - precision
  - recall

param_distributions:
  selector__max_features:
    - 10
    - 15
    - 25
    - 35
  classifier__solver:
    - liblinear
  classifier__l1_ratio:
    - 0.0
    - 1.0
  classifier__C:
    - 0.001
    - 0.01
    - 0.1
