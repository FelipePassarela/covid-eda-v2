[project]
name = "covid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FelipePassarela", email = "126916744+FelipePassarela@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "missingno>=0.5.2",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "pyrefly>=0.60.0",
    "pyyml>=0.0.2",
    "ruff>=0.15.22",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "statsmodels>=0.14.6",
    "tqdm>=4.68.3",
    "typer>=0.26.7",
    "umap-learn>=0.5.12",
    "wandb>=0.28.1",
    "xgboost>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[project.scripts]
split = "covid.cli.split_data:main"
tune = "covid.cli.tune_models:main"
train = "covid.cli.train:main"
