[project]
name = "covid-tuning"
version = "0.1.0"
description = "Hyperparameter search and nested cross-validation for COVID-EDA"
requires-python = "==3.13.*"
dependencies = [
    "covid-common",
    "hydra-core>=1.3.4",
    "imbalanced-learn>=0.14.2",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "omegaconf>=2.3.1",
    "optuna>=5.0.0",
    "optuna-integration[sklearn]>=5.0.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "typer>=0.26.7",
    "wandb>=0.28.1",
]

[project.scripts]
tune = "covid_tuning.search.cli:main"
eval-tune = "covid_tuning.eval.cli:main"
boxplot = "covid_tuning.eval.visualization.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
