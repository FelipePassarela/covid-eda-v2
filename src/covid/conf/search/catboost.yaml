defaults:
  - /pipeline: catboost
  - _self_

data_path: data/interim/train.csv

n_splits: 5
n_fold_repeats: 1
n_searches: 10

scoring:
  - balanced_accuracy
  - f1
  - precision
  - recall

param_distributions:
  selector__k:
    - 10
    - 15
    - 30
    - 50
  classifier__n_estimators:
    - 30
    - 50
    - 100
    - 300
  classifier__learning_rate:
    - 0.01
    - 0.03
    - 0.1
  classifier__depth:
    - 2
    - 3
    - 4
    - 6
  classifier__l2_leaf_reg:
    - 0
    - 1
    - 5
  classifier__rsm:
    - 0.6
    - 0.8
    - 1.0
