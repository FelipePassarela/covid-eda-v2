[project]
name = "covid-eda-v2"
version = "0.1.0"
description = "Workspace for exploratory analysis and classification of long COVID"
readme = "README.md"
authors = [
    { name = "FelipePassarela", email = "126916744+FelipePassarela@users.noreply.github.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "covid-common",
    "covid-eda",
    "covid-model",
    "covid-tuning",
]

[dependency-groups]
dev = [
    "pandas-stubs~=3.0.3",
    "pre-commit>=4.7.0",
    "pyrefly>=0.60.0",
    "pytest>=9.1.0",
    "ruff>=0.15.22",
    "scipy-stubs~=1.18.0",
]
notebooks = [
    "ipykernel>=7.3.0",
    "missingno>=0.5.2",
    "umap-learn>=0.5.12",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
covid-common = { workspace = true }
covid-eda = { workspace = true }
covid-model = { workspace = true }
covid-tuning = { workspace = true }

[tool.ruff.lint.isort]
known-first-party = ["covid_common", "covid_eda", "covid_model", "covid_tuning"]
# W&B creates a local wandb/ directory for run artifacts.
known-third-party = ["wandb"]

[tool.pyrefly]
search-path = [
    ".",
    "packages/common/src",
    "packages/eda/src",
    "packages/model/src",
    "packages/tuning/src",
]

[tool.pytest.ini_options]
filterwarnings = [
    'ignore:OptunaSearchCV is experimental.*:optuna.exceptions.ExperimentalWarning',
    'ignore:`optuna\.terminator` module has been deprecated.*:FutureWarning:optuna_integration\.sklearn\.sklearn',
]
