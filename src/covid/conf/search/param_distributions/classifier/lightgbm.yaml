# subsample_freq=1 enables row sampling; max_depth also caps num_leaves.
classifier__colsample_bytree:
  _target_: optuna.distributions.FloatDistribution
  low: 0.6
  high: 1.0
classifier__learning_rate:
  _target_: optuna.distributions.FloatDistribution
  low: 0.01
  high: 0.1
  log: true
classifier__max_depth:
  _target_: optuna.distributions.IntDistribution
  low: 2
  high: 6
classifier__min_child_samples:
  _target_: optuna.distributions.IntDistribution
  low: 5
  high: 30
classifier__n_estimators:
  _target_: optuna.distributions.IntDistribution
  low: 30
  high: 300
  step: 10
classifier__num_leaves:
  _target_: optuna.distributions.IntDistribution
  low: 4
  high: 64
classifier__reg_alpha:
  _target_: optuna.distributions.FloatDistribution
  low: 0.0
  high: 1.0
classifier__reg_lambda:
  _target_: optuna.distributions.FloatDistribution
  low: 0.1
  high: 5.0
  log: true
classifier__subsample:
  _target_: optuna.distributions.FloatDistribution
  low: 0.6
  high: 1.0
classifier__subsample_freq:
  _target_: optuna.distributions.CategoricalDistribution
  choices:
    - 1
