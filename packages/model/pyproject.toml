[project]
name = "covid-model"
version = "0.1.0"
description = "Model training, holdout evaluation and SHAP explanations for COVID-EDA"
requires-python = "==3.13.*"
dependencies = [
    "covid-common",
    "hydra-core>=1.3.4",
    "imbalanced-learn>=0.14.2",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "typer>=0.26.7",
    "wandb>=0.28.1",
]

[project.scripts]
covid-model = "covid_model.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
