[project]
name = "covid-eda"
version = "0.1.0"
description = "Exploratory data analysis and association-based feature selection for COVID-EDA"
requires-python = "==3.13.*"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
