defaults:
  - /pipeline: svm
  - override /pipeline/preprocessor: linear-selectk-elasticnet
  - _self_

name: tune-${hydra:runtime.choices.pipeline}
data_path: data/interim/train.csv

n_splits: 5
n_fold_repeats: 1
n_searches: 100

scoring:
  - balanced_accuracy
  - f1
  - precision
  - recall

param_distributions:
  selector__max_features:
    - 10
    - 15
    - 25
    - 35
  classifier__C:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
  classifier__kernel:
    - linear
    - rbf
  classifier__gamma:
    - scale
    - auto
    - 0.001
    - 0.01